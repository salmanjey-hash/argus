[[case]]
id = "tornado-cash"
name = "Tornado Cash: sanctioning code"
year = "2022 designation, later litigation"
jurisdiction = "US / Global"
headline = "A crypto mixer designated by OFAC, turning mixer exposure into a sanctions question."
typology_ids = ["mixers", "crypto-laundering", "sanctions-evasion", "proliferation"]
backstory = """
Tornado Cash was a decentralised mixing service on the Ethereum blockchain. Users
deposited funds into a pool and later withdrew to a different address, severing the
on-chain link between source and destination.

In August 2022 the US Treasury designated it, stating it had been used to launder
large volumes of criminal proceeds, including funds attributed to the Lazarus Group,
a state-sponsored North Korean hacking organisation. That last point is what made it a
proliferation-financing matter as well as an AML one: the proceeds were funding a
sanctioned weapons programme.

The designation was legally novel because the target was substantially autonomous
software rather than a company, and it prompted significant litigation and debate about
sanctioning code. The designation was subsequently challenged in the US courts, and the
legal position around it has continued to develop."""
what_happened = """
Following designation, US persons were prohibited from transacting with the associated
addresses. Major exchanges and DeFi front-ends began blocking addresses with Tornado
Cash exposure. Separately, individuals associated with developing and operating the
service faced criminal proceedings in the US and the Netherlands."""
bank_impact = """
It changed how firms treat blockchain analytics output. Exposure to a designated mixer
is not merely an elevated AML risk score - it is potential sanctions exposure, which
carries strict liability and a different escalation path. It also forced firms to
develop a position on indirect exposure: how many hops from a designated address still
counts."""
analyst_lesson = """
Separate the two questions. "Has this customer touched a mixer?" is an AML risk
question. "Has this customer touched a designated mixer?" is a sanctions question that
you escalate immediately rather than risk-assess. Record hop distance, and have a
documented, consistent policy for indirect exposure rather than deciding case by case."""
[[case.sources]]
title = "US Treasury - Sanctions virtual currency mixer Tornado Cash"
url = "https://home.treasury.gov/news/press-releases/jy0916"

