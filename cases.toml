[[case]]
id = "1mdb"
name = "1MDB: a sovereign wealth fund looted"
year = "2009-2015, prosecutions ongoing"
jurisdiction = "Malaysia / US / Singapore / Switzerland"
headline = "Billions diverted from a state development fund through shell companies, banks and luxury assets."
typology_ids = ["pep-kleptocracy", "shell-companies", "professional-enablers", "real-estate", "correspondent-nested"]
backstory = """
1Malaysia Development Berhad was a state investment fund created in 2009. Money raised
through bond issues, ostensibly for development projects, was instead diverted through
a chain of shell companies and accounts across multiple jurisdictions.

The laundering was textbook integration: the proceeds bought high-end real estate in
New York, London and Los Angeles, a superyacht, artworks, jewellery - and, notoriously,
helped finance a Hollywood film about financial excess. Financier Jho Low was
identified as central to the movement of funds; Malaysia's then prime minister Najib
Razak was later convicted domestically of charges relating to funds from a former
1MDB unit.

Several banks and bankers were implicated in moving or failing to question the flows.
Goldman Sachs, which arranged bond issues for the fund, reached a large-scale
resolution with US authorities in 2020, and Singapore shut down local operations of
two private banks over their handling of related flows."""
what_happened = """
The US Department of Justice brought its largest ever kleptocracy asset recovery action,
seizing and recovering assets bought with diverted funds. Multiple jurisdictions
prosecuted individuals and institutions. Recovery and prosecution continue more than a
decade after the offending began."""
bank_impact = """
1MDB is the reference case for how a PEP-linked flow crosses many institutions and is
questioned by none of them individually. Each bank saw a slice that looked odd but
survivable. It drove supervisory focus on private banking source-of-wealth
documentation, on the risk of sovereign and state-owned entity customers, and on the
responsibility of arranging banks for what the money they raise is used for."""
analyst_lesson = """
Payments from state-owned entities or sovereign funds into private structures deserve
the same question every time: what is the commercial rationale, and who ultimately
benefits? Complexity is not sophistication - a chain of companies across several
secrecy jurisdictions with no operating substance is the typology, not the cover for
it."""
[[case.sources]]
title = "US DOJ - 1MDB asset recovery"
url = "https://www.justice.gov/archives/opa/pr/united-states-reaches-settlement-recover-more-49-million-assets-traceable-1mdb"

