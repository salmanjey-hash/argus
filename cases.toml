# ARGUS FINCRIME - real case library
#
# Each case is a documented, publicly-reported financial crime matter, linked to
# the typologies it illustrates. Headline facts were checked against primary
# sources (regulator press releases, court records, DOJ/FCA announcements) when
# this file was written.
#
# IMPORTANT: these are compiled summaries for analyst training. The linked
# primary source is the authority - read it before relying on any detail here.
# Run `python argus.py verify --cases` to re-check every link is live.
#
# To add a case: copy a block, keep the id kebab-case, and list the typology ids
# it illustrates in `typology_ids`.

[[case]]
id = "natwest-fowler-oldfield"
name = "NatWest and Fowler Oldfield"
year = "2021"
jurisdiction = "UK"
headline = "The FCA's first criminal prosecution of a bank under the Money Laundering Regulations. £264.8m fine."
typology_ids = ["cash-intensive", "structuring", "sars-daml"]
backstory = """
Fowler Oldfield was a Bradford gold dealer. When NatWest took the company on as a
customer, its predicted annual turnover was around £15 million. Over roughly five
years the company deposited about £365 million with the bank, of which around
£264 million was cash. At the peak, couriers were bringing cash into branches in
bin bags - on one occasion staff recorded so much cash that it could not be fitted
into the counting machine.

The failure was not that nobody noticed. It was that the bank's systems and people
did not act on what they saw. A significant volume of cash deposits was mis-coded
by the system as cheque deposits, which routed them through less stringent rules.
Fowler Oldfield's risk rating was moved from high to low without a documented
reason. The £15 million expected turnover captured at onboarding was never
revisited against the £365 million that actually flowed."""
what_happened = """
NatWest pleaded guilty to three offences of failing to comply with the Money
Laundering Regulations 2007. On 13 December 2021 at Southwark Crown Court it was
fined £264,772,619.95 - reduced from a headline £397 million because of the guilty
plea - plus a confiscation order and the FCA's costs. It was the first time the FCA
had brought a criminal prosecution under the MLR against a bank. A separate West
Yorkshire Police investigation led to further prosecutions of individuals connected
to the cash deposits."""
bank_impact = """
The case reset UK expectations in three ways. First, it established that AML
failure can be prosecuted criminally, not just fined civilly. Second, it showed
that a stale onboarding assumption - an expected turnover figure nobody refreshed -
is itself a control failure. Third, it made transaction-coding integrity a board
issue: a mapping error that sent cash down a cheque workflow was central to the
judgment."""
analyst_lesson = """
Expected activity captured at onboarding is a control, not a form field. If actual
turnover diverges from expectation by an order of magnitude, that divergence is the
alert. Also: check what your system thinks a transaction is. Cash mis-coded as
cheque was invisible precisely because the data said it was something else."""
[[case.sources]]
title = "FCA - NatWest fined £264.8 million for anti-money laundering failures"
url = "https://www.fca.org.uk/news/press-releases/natwest-fined-264.8million-anti-money-laundering-failures"

