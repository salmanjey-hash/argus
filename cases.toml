[[case]]
id = "hajiyeva-uwo"
name = "Zamira Hajiyeva and the UK's first Unexplained Wealth Order"
year = "2018 UWO, assets forfeited 2024-25"
jurisdiction = "UK"
headline = "£16m spent in Harrods over a decade on 54 credit cards linked to a state bank her husband ran."
typology_ids = ["pep-kleptocracy", "real-estate", "professional-enablers"]
backstory = """
Jahangir Hajiyev was chairman of the state-controlled International Bank of
Azerbaijan from 2001 to 2015. He was later convicted of fraud and embezzlement and
sentenced to a long prison term.

His wife Zamira Hajiyeva spent approximately £16 million at Harrods over about a
decade, using 54 credit cards, many linked to her husband's bank. She held a
Knightsbridge house and, through a corporate structure, a Berkshire golf club.

The question the NCA put was simple and is the core PEP question: how does a
declared income support this? A UWO reverses the usual burden - it requires the
respondent to explain the source of wealth behind specific assets."""
what_happened = """
In 2018 the NCA obtained the UK's first Unexplained Wealth Order against her. She
challenged it and lost, with the order upheld on appeal. After a long investigation
she agreed to give up the Knightsbridge property and the Berkshire golf club, which
were put up for sale together for around £19.5 million."""
bank_impact = """
It showed that spending patterns are intelligence. Harrods was not a bank, but the
card activity was processed by regulated firms, and the concentration - 54 cards,
one merchant, eight figures, cards issued by a foreign state-controlled bank the
holder's husband chaired - is exactly the sort of pattern institutions are expected
to question. It also confirmed that UWOs are usable, which raised expectations of
source-of-wealth evidencing for PEP relationships across UK private banking."""
analyst_lesson = """
For a PEP, source of wealth is a career-length question, not a transaction-level one.
"My husband is a banker" is not a source of wealth. Ask what the role paid, over what
period, and whether that plausibly funds what you are looking at. Also screen close
family and associates, not just the named official."""
[[case.sources]]
title = "NCA - Unexplained Wealth Orders"
url = "https://www.nationalcrimeagency.gov.uk/what-we-do/crime-threats/money-laundering-and-illicit-finance"

