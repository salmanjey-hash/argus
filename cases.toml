[[case]]
id = "rimasauskas-bec"
name = "Evaldas Rimasauskas: the BEC that fooled Google and Facebook"
year = "2013-2015, sentenced 2019"
jurisdiction = "US / Lithuania / Latvia"
headline = "Over $100m obtained by invoicing two of the world's most sophisticated companies."
typology_ids = ["bec-invoice", "shell-companies", "money-mules"]
backstory = """
Rimasauskas registered a company in Latvia with a name closely matching Quanta
Computer, a large Taiwanese hardware manufacturer that genuinely supplied both
Google and Facebook. That single act - a lookalike corporate identity in a
different jurisdiction - is the whole scheme in miniature.

He then sent forged invoices, contracts and letters that appeared to be executed and
signed by executives of the companies being impersonated, along with forged bank
instructions. Because both victims really did owe Quanta money, the invoices did not
look fraudulent. They looked like business as usual.

Payments were received into accounts in Latvia and Cyprus and then dispersed across
multiple jurisdictions."""
what_happened = """
Facebook wired close to $100 million and Google over $23 million before the scheme
was detected. Rimasauskas was arrested in Lithuania in March 2017, extradited to the
United States, and pleaded guilty to wire fraud in March 2019. He was sentenced to
five years in prison, ordered to forfeit nearly $50 million and to pay over $26
million in restitution. Both companies recovered most or all of the money."""
bank_impact = """
It is a standing rebuttal to "our customers are too sophisticated for this". For the
receiving bank the red flags were entirely visible on their side: a newly
incorporated company with a name mimicking an established manufacturer, receiving
eight-figure credits from unrelated global corporates, then dispersing them
onward. Inbound-side detection is a bank obligation, not just the victim's problem."""
analyst_lesson = """
Name-similarity to an established company is a first-order onboarding red flag,
especially when the incorporation is recent and in a different jurisdiction from the
company being echoed. Then watch the pattern: large first credit from an unrelated
corporate, followed by rapid dispersal."""
[[case.sources]]
title = "US DOJ - Lithuanian man sentenced for wire fraud scheme against US tech companies"
url = "https://www.justice.gov/usao-sdny/pr/lithuanian-man-sentenced-5-years-prison-theft-over-120-million-fraudulent-business"

