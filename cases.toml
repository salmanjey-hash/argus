[[case]]
id = "bitfinex-lichtenstein"
name = "The Bitfinex hack and the Lichtenstein/Morgan laundering"
year = "2016 hack, 2022 arrests, 2024 sentencing"
jurisdiction = "US / Global"
headline = "119,754 bitcoin stolen; a six-year laundering effort unwound by blockchain tracing."
typology_ids = ["crypto-laundering", "mixers", "structuring", "shell-companies"]
backstory = """
In August 2016 the crypto exchange Bitfinex was hacked. The intruder fraudulently
authorised more than 2,000 transactions moving 119,754 bitcoin out of the exchange
into a wallet under their control.

The interesting part for an AML analyst is not the hack - it is the six years of
laundering that followed. Ilya Lichtenstein and his wife Heather Morgan moved the
proceeds using a stack of techniques: automated transactions in rapid succession,
deposits into accounts at multiple darknet markets and exchanges then withdrawing
them to break the chain, converting to other assets including privacy coins, using
US-based business accounts to legitimise banking activity, and buying gold and
prepaid cards.

Because the blockchain is a permanent public ledger, none of this deleted the trail
- it only lengthened it. Investigators were eventually able to follow it."""
what_happened = """
The couple were arrested in February 2022. Both pleaded guilty to money laundering
conspiracy. In November 2024 Lichtenstein was sentenced to five years and Morgan to
18 months. Authorities recovered the great majority of the stolen bitcoin - by the
time of sentencing, worth roughly $10 billion."""
bank_impact = """
For banks and payment firms, the lesson is about the fiat edges. The laundering
relied on ordinary business accounts and prepaid instruments to convert crypto value
into spendable money. That conversion point is where a regulated firm has both
visibility and obligation. It also demonstrated why blockchain analytics exposure
scoring became standard practice for firms banking crypto businesses."""
analyst_lesson = """
Crypto laundering is not untraceable - it is deferred traceability. Your control
point is the on-ramp and off-ramp. Watch for business accounts whose stated activity
does not explain crypto-linked inflows, and treat purchases of gold and prepaid
instruments after crypto liquidation as a recognised integration pattern."""
[[case.sources]]
title = "US DOJ - Bitfinex hacker sentenced for money laundering conspiracy"
url = "https://www.justice.gov/usao-dc/pr/bitfinex-hacker-sentenced-money-laundering-conspiracy-involving-billions-stolen"

