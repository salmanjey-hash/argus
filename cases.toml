[[case]]
id = "lebanese-canadian-bank"
name = "Lebanese Canadian Bank: used cars and Hezbollah financing"
year = "2011 action"
jurisdiction = "US / Lebanon / West Africa"
headline = "Drug proceeds laundered through second-hand car exports and consumer goods trade."
typology_ids = ["tbml", "hawala", "cash-intensive", "npo-abuse"]
backstory = """
The scheme wove together drug trafficking, trade and informal value transfer. Proceeds
from cocaine sales were consolidated and moved to Lebanon through exchange houses and
bulk cash smuggling. From there, funds were wired to the United States to buy used
cars.

The cars were shipped to West Africa and sold, typically for cash. Those proceeds -
now looking like ordinary vehicle sales revenue - were moved back to Lebanon, mixed
with other trade flows in consumer goods. At each step the money acquired a more
legitimate-looking commercial explanation, and value crossed borders inside real
trade rather than as suspicious transfers.

US authorities alleged the network was linked to Hezbollah financing, which added a
terrorist-financing dimension to what was structurally a TBML and IVTS case."""
what_happened = """
In 2011 the US Treasury named Lebanese Canadian Bank as a financial institution of
primary money laundering concern under section 311 of the USA PATRIOT Act. The bank was
effectively cut off from the US financial system and was subsequently wound down and
its assets sold. Related civil forfeiture actions targeted car dealerships and
shipping-linked businesses."""
bank_impact = """
It is the clearest published illustration of why trade and used-goods flows are a
laundering channel, and it shaped correspondent banking risk appetite for the region.
For a bank, the exposure was through ordinary commercial customers - car dealerships
and exporters - whose activity looked like trade because it was trade. The illicit
element was whose money funded it."""
analyst_lesson = """
Trade-based laundering usually involves real goods really moving. Do not expect the
shipment to be fake. Look instead at whether the payer is connected to the buyer,
whether payments come from third parties in unrelated jurisdictions, and whether the
volume of a dealer's business is explicable by its size and premises."""
[[case.sources]]
title = "US Treasury - Lebanese Canadian Bank named primary money laundering concern"
url = "https://home.treasury.gov/news/press-releases/tg1057"

