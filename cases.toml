[[case]]
id = "wachovia-casa-de-cambio"
name = "Wachovia and the Mexican casas de cambio"
year = "2004-2007, resolved 2010"
jurisdiction = "US / Mexico"
headline = "$378 billion in unmonitored correspondent flows; drug cartel proceeds bought aircraft."
typology_ids = ["correspondent-nested", "hawala", "cash-intensive", "structuring"]
backstory = """
Wachovia provided correspondent banking services to Mexican casas de cambio - currency
exchange houses. These are legitimate businesses serving a real need in a
cash-heavy remittance corridor. The problem was the near-total absence of monitoring
of what flowed through them.

Roughly $378 billion moved through these correspondent relationships over about four
years with inadequate AML oversight. Some of that flow was drug-trafficking proceeds.
Investigators were able to trace funds that had passed through the accounts to the
purchase of aircraft later seized carrying multi-tonne cocaine loads.

The failure was structural: the bank onboarded the exchange houses but did not treat
their customers' activity as something it needed visibility into."""
what_happened = """
In 2010 Wachovia - by then acquired by Wells Fargo - entered a deferred prosecution
agreement, forfeiting around $110 million and paying a $50 million civil penalty for
failing to maintain an effective AML programme."""
bank_impact = """
It is the foundational correspondent banking case. It established in practical terms
that providing rails to a money service business means owning visibility into the risk
that business carries - the origin of the enhanced due diligence expectations now
codified for correspondent relationships. It is also the case most often cited in
debates about de-risking, because one response to it was banks exiting the corridor
entirely rather than monitoring it properly."""
analyst_lesson = """
When your customer is a financial institution or MSB, your customer's customers are
your risk. Ask for their AML programme, ask whether they permit nesting, and monitor
the corridor volumes against what their declared business could plausibly generate."""
[[case.sources]]
title = "US DOJ - Wachovia enters deferred prosecution agreement"
url = "https://www.justice.gov/archives/opa/pr/wachovia-enters-deferred-prosecution-agreement"

