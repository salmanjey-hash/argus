[[case]]
id = "operation-fort"
name = "Operation Fort: the UK's largest modern slavery prosecution"
year = "2014-2017 offending, trials 2019-2021"
jurisdiction = "UK"
headline = "92 identified victims, possibly up to 400 exploited. Banks were the visible touchpoint."
typology_ids = ["human-trafficking", "money-mules", "cash-intensive"]
backstory = """
An organised crime group recruited vulnerable people in Poland - many homeless, in
addiction recovery, or with convictions - with promises of well-paid work and
accommodation in the West Midlands. On arrival, victims were housed in squalid
conditions and put to work in farms, factories, waste recycling plants and parcel
sorting warehouses, often through legitimate employment agencies supplying real
businesses.

The financial mechanics are what make it a KYC case. Traffickers accompanied victims
to open bank accounts, doing the talking because the victims spoke little English.
Wages were paid legitimately into those accounts by real employers - and then
withdrawn or transferred straight to the controllers. Victims were left with a
fraction of their earnings. When one perpetrator accumulated too much, he brought in
an accomplice; nearly £140,000 was paid into that accomplice's account, cashed, and
handed back."""
what_happened = """
Following a West Midlands Police investigation with the Gangmasters and Labour Abuse
Authority and Polish authorities, prosecutions ran in 2019 and 2021, with 11 people
convicted. The Independent Anti-Slavery Commissioner published a review specifically
examining what businesses, including banks, should learn from it."""
bank_impact = """
This case is why UK banks built modern-slavery indicators into monitoring. The
pattern was detectable in bank data alone: clusters of accounts sharing addresses and
phone numbers, opened in the presence of a third party who did the talking, receiving
payroll credits from a small set of employers and sweeping to a common beneficiary
the same day. The Commissioner's review made the point that branch staff observations
were a genuine intelligence source that was underused."""
analyst_lesson = """
Cluster your book by address, phone number and device - this typology is invisible
per-account and obvious in aggregate. And treat "third party accompanies customer and
answers for them at account opening" as a recordable red flag, not an inconvenience.
Remember the account holder is a victim: report, but handle through vulnerability
protocols and never tip off."""
[[case.sources]]
title = "CPS - Convictions in largest ever modern slavery prosecution"
url = "https://www.cps.gov.uk/west-midlands/news/secures-convictions-largest-ever-modern-slavery-prosecution"
[[case.sources]]
title = "Independent Anti-Slavery Commissioner - Operation Fort review (PDF)"
url = "https://www.antislaverycommissioner.co.uk/media/z35hayca/iasc-operation-fort-review-june-2020.pdf"

