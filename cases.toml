[[case]]
id = "danske-estonia"
name = "Danske Bank, Estonia branch"
year = "2007-2015, settled 2022"
jurisdiction = "EU / Global"
headline = "About €200 billion in non-resident flows through one small branch. $2bn+ in US and Danish settlements."
typology_ids = ["shell-companies", "correspondent-nested", "pep-kleptocracy", "professional-enablers"]
backstory = """
Danske Bank acquired Finland's Sampo Bank in 2007, and with it a small Estonian
branch. That branch ran a "non-resident portfolio" - customers who were not
Estonian, largely from Russia and other former Soviet states, routed through
UK, BVI and Cyprus corporate structures with obscured beneficial ownership.

The branch was extraordinarily profitable relative to its size, which was itself
the warning. It operated on a separate IT platform from group systems, so group
compliance had limited visibility. Internal and external warnings - including from
a whistleblower and from correspondent banks - were raised over years before the
scale became public in 2017-2018.

An important nuance often lost in reporting: the €200 billion figure is the total
flow through the portfolio, not a finding that €200 billion was laundered. A large
share was legitimate. The compliance failure is that the bank could not tell the
difference."""
what_happened = """
Danske exited the Estonian market and commissioned an external investigation that
became public in 2018. In December 2022 Danske Bank pleaded guilty in the United
States to conspiracy to commit bank fraud and agreed to forfeit $2 billion, with
parallel resolutions involving Danish authorities and the SEC. Senior executives
departed; several faced criminal investigation in Denmark and Estonia."""
bank_impact = """
This is the case that made "correspondent banking exposure" a board-level topic
across Europe. It demonstrated that a subsidiary or branch on a separate technology
stack is a blind spot, not just an integration nuisance; that profitability wildly
out of line with a unit's size is a red flag in itself; and that a correspondent
bank inherits the risk of everyone its respondent serves. It directly informed the
architecture of the EU's new single supervisor, AMLA."""
analyst_lesson = """
Ask where the money is coming from and whether the entity structure lets you answer
that. A customer base of non-resident shell companies, held on a system your group
compliance cannot see into, is the whole typology in one sentence. And treat
unusually high margin as a risk indicator, not a success story."""
[[case.sources]]
title = "US DOJ - Danske Bank pleads guilty to fraud on US banks"
url = "https://www.justice.gov/opa/pr/danske-bank-pleads-guilty-fraud-us-banks-multi-billion-dollar-scheme-access-us-financial"

