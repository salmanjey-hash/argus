[[case]]
id = "crown-star-casinos"
name = "Crown Resorts and Star Entertainment"
year = "Inquiries 2020-2022, penalties 2023-2024"
jurisdiction = "Australia"
headline = "Junket operators, cash in hotel rooms, and a hotel booking channel used to disguise gambling transactions."
typology_ids = ["gambling", "cash-intensive", "pep-kleptocracy", "professional-enablers"]
backstory = """
Australian casino operators used "junket" operators to bring high-value international
gamblers. Public inquiries found that some junket operators had links to organised
crime, and that due diligence on them and on patrons was inadequate.

The specific mechanics were striking. Large volumes of cash were accepted with weak
source-of-funds enquiry, including cash delivered in bags to hotel rooms. At Crown,
subsidiary bank accounts were used in ways that disguised the true nature of gambling
transactions - patrons made payments that were processed as hotel or accommodation
charges rather than gambling. Patron accounts were used to move funds in patterns
inconsistent with gambling activity."""
what_happened = """
A series of royal commissions and public inquiries in New South Wales, Victoria and
Western Australia found both operators unsuitable to hold their licences, subject to
remediation and supervision. AUSTRAC brought civil penalty proceedings; Crown was
ordered to pay a A$450 million penalty in 2023, and Star agreed to a A$300 million
penalty in 2024. Boards and senior management were substantially replaced."""
bank_impact = """
For banks the read-across is about what a payment descriptor actually represents. When
gambling transactions are processed through an accommodation merchant category, the
bank's own monitoring is looking at the wrong thing. It also reinforced that
casinos are regulated AML entities in their own right, and that a bank serving them
inherits questions about their controls."""
analyst_lesson = """
Test whether the merchant category and payment narrative match the underlying activity.
For gambling customers, the ratio of deposits to actual play is the single most useful
signal - money in and straight out with minimal turnover is not gambling, it is
laundering."""
