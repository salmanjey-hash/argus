[[case]]
id = "pandora-panama-papers"
name = "Panama and Pandora Papers"
year = "2016 and 2021 leaks"
jurisdiction = "Global"
headline = "Leaked records exposing how offshore structures are built, and by whom."
typology_ids = ["professional-enablers", "shell-companies", "pep-kleptocracy", "real-estate"]
backstory = """
The Panama Papers (2016) were a leak of documents from Mossack Fonseca, a Panamanian
law firm that incorporated offshore companies at scale. The Pandora Papers (2021) drew
on records from multiple offshore service providers. Together they gave the public -
and regulators - an unusually direct view of how opacity is manufactured.

What the documents showed was less exotic than expected. The techniques were ordinary
and industrialised: nominee directors and shareholders standing in for real owners,
companies incorporated in bulk and held on the shelf, layers of entities across
several jurisdictions so no single register reveals control, and bearer instruments.

Crucially, most of this was done by regulated professionals - lawyers, accountants and
company formation agents. Not all of it was illegal. The significance for AML is that
the same machinery serves legitimate tax planning and serious criminal concealment, and
the paperwork looks identical."""
what_happened = """
The leaks triggered investigations in many countries, resignations of political figures,
tax recoveries running to billions, and prosecutions. They directly accelerated
beneficial ownership registry reform - including the UK's register of overseas entities
and the EU's beneficial ownership provisions - and sharpened scrutiny of trust and
company service providers."""
bank_impact = """
For banks the practical consequence was that "a regulated professional introduced this
client" stopped being an acceptable substitute for your own due diligence. The leaks
showed regulated intermediaries constructing exactly the structures that defeat
ownership transparency. Registry reform then gave institutions a source to check
against - and an expectation that they will."""
analyst_lesson = """
Trace ownership to a natural person and record precisely where the chain goes cold and
why. Nominee arrangements and multi-jurisdiction layering are the signal. And never
treat an intermediary's assurance as verification - the enabler may be the risk."""
[[case.sources]]
title = "ICIJ - The Panama Papers investigation"
url = "https://www.icij.org/investigations/panama-papers/"
[[case.sources]]
title = "ICIJ - The Pandora Papers investigation"
url = "https://www.icij.org/investigations/pandora-papers/"
