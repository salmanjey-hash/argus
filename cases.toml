[[case]]
id = "bnp-paribas-sanctions"
name = "BNP Paribas sanctions violations"
year = "2004-2012, resolved 2014"
jurisdiction = "US / France"
headline = "$8.9 billion forfeiture - at the time the largest sanctions penalty ever imposed."
typology_ids = ["sanctions-evasion", "correspondent-nested"]
backstory = """
Over roughly eight years, BNP Paribas processed billions of dollars of transactions
through the US financial system on behalf of entities in Sudan, Iran and Cuba, which
were subject to US sanctions.

The mechanics were deliberate concealment rather than oversight. Payment messages
were stripped or amended to remove references to sanctioned parties, satellite banks
were used to disguise the origin of transactions, and internal warnings about the
practice were not acted upon. This is why the case is a sanctions-evasion case rather
than a screening-failure case: the controls were not simply weak, they were worked
around."""
what_happened = """
In 2014 BNP Paribas pleaded guilty to conspiring to violate US sanctions and agreed
to pay $8.9 billion. It was also subject to a temporary suspension of certain US
dollar clearing operations - for a bank, an operational sanction with more sting
than the fine."""
bank_impact = """
Two lasting effects. First, it established that US dollar clearing gives US
authorities jurisdiction over conduct largely outside the US, which is why non-US
banks screen against OFAC lists at all. Second, the temporary loss of dollar-clearing
privileges showed that the real risk in sanctions breach is not the fine but the loss
of market access. Payment-message integrity - not stripping fields - became a
first-order control."""
analyst_lesson = """
Watch for incomplete originator or beneficiary information in payment messages. Field
stripping is a discrete red flag in its own right, separate from whether a name
matches a list. And remember sanctions are strict liability - the risk-based judgement
you apply in AML does not transfer."""
[[case.sources]]
title = "US DOJ - BNP Paribas agrees to plead guilty and pay $8.9 billion"
url = "https://www.justice.gov/opa/pr/bnp-paribas-agrees-plead-guilty-and-pay-89-billion-illegally-processing-financial"

