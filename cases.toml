[[case]]
id = "dprk-it-workers"
name = "North Korean IT workers inside Western payrolls"
year = "Advisories from 2022, prosecutions ongoing"
jurisdiction = "US / Global"
headline = "Sanctioned-state revenue generation through remote contract work and stolen identities."
typology_ids = ["proliferation", "sanctions-evasion", "emi-fintech", "money-mules"]
backstory = """
Thousands of North Korean IT workers have been placed as remote contractors with
companies in the US, Europe and Asia, using stolen or fabricated identities and
operating from third countries including China and Russia. Their earnings - often
substantial, and sometimes across several simultaneous jobs held by one person -
are routed back to the DPRK regime, contributing to sanctioned weapons programmes.

The financial fingerprints are distinctive. Payment is requested to accounts that do
not match the contractor's claimed identity or location, often payment platforms and
e-money accounts rather than mainstream banks. Payment instructions change frequently.
Multiple supposedly unrelated contractors share banking details, devices or addresses.

Some cases involved "laptop farms" run by US-based facilitators, where company-issued
hardware was kept in the US and accessed remotely, so the equipment appeared to be in
the right country."""
what_happened = """
US authorities have issued repeated advisories, brought prosecutions against
facilitators, and seized accounts and websites used in the schemes. The pattern has
been observed across many companies, including firms that had no idea they had hired a
sanctioned-state worker."""
bank_impact = """
This is proliferation financing arriving through payroll and payment-platform rails
rather than trade finance. For e-money institutions and payment firms in particular, it
sits squarely in the onboarding controls: identity documents that do not withstand
liveness or authenticity checks, and clusters of accounts sharing technical
fingerprints. Because the end use is a weapons programme, it is a sanctions matter."""
analyst_lesson = """
Look for mismatch between claimed location and payment destination, third-party payment
instructions, and shared device or IP fingerprints across nominally unconnected
customers. Where a contractor's identity documentation is inconsistent and payment is
directed to an unrelated party, escalate as a potential sanctions issue rather than
routine fraud."""
[[case.sources]]
title = "US Treasury / State - Guidance on DPRK IT workers"
url = "https://ofac.treasury.gov/recent-actions"

