[[case]]
id = "deutsche-mirror-trades"
name = "Deutsche Bank mirror trading, Moscow"
year = "2011-2015, fined 2017"
jurisdiction = "UK / US / Russia"
headline = "About $10 billion moved out of Russia through paired trades with no economic purpose."
typology_ids = ["shell-companies", "correspondent-nested", "professional-enablers"]
backstory = """
The scheme was elegant in its simplicity. A customer would buy a liquid Russian blue-chip
stock in Moscow, paying in roubles. Almost simultaneously, a related customer - often
registered offshore and sharing beneficial ownership - would sell the identical
quantity of the same stock in London, receiving US dollars or other hard currency.

No net market position was taken. Nothing was really being invested. The only effect
was that value left Russia in roubles and arrived offshore in dollars. The trades
were "mirrors" of each other, which is where the name comes from.

Roughly $10 billion moved this way. The counterparties were frequently shell companies
registered in offshore jurisdictions with common ownership - a fact discoverable from
the bank's own records."""
what_happened = """
In January 2017 the UK's FCA fined Deutsche Bank £163 million for AML control
failings, then its largest such penalty, and the New York Department of Financial
Services imposed a separate $425 million penalty. Regulators found the bank's AML
control framework had significant deficiencies through the relevant period."""
bank_impact = """
It broadened where AML monitoring has to look. Before this, transaction monitoring in
many banks concentrated on payments; mirror trading happened in the securities
business, where surveillance was tuned for market abuse rather than laundering. The
case forced firms to monitor trading activity for laundering typologies too, and to
look at customer-to-customer relationships rather than accounts in isolation."""
analyst_lesson = """
Look for offsetting trades between related parties with no economic rationale - equal
and opposite positions, settled in different currencies or jurisdictions, that leave
no net exposure. If a customer's trading generates no profit or loss but does change
the currency and location of their money, that is the point of the exercise."""
[[case.sources]]
title = "FCA - Deutsche Bank fined £163 million for anti-money laundering controls failure"
url = "https://www.fca.org.uk/news/press-releases/fca-fines-deutsche-bank-163-million-anti-money-laundering-controls-failure"

