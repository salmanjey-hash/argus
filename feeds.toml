# FinCrime Radar - source configuration
# Every source below was HTTP-verified before being added. See README.md "Evidence policy".
# type:  rss | atom | api_govuk | links
# tier:  1 = primary regulator/lawmaker, 2 = FIU/law-enforcement/typology, 3 = commentary & press
# cadence: daily | weekly   (weekly sources are skipped on daily runs to stay polite and fast)

# ============================================================ UK - TIER 1
[[source]]
name = "FCA - News"
url = "https://www.fca.org.uk/news/rss.xml"
homepage = "https://www.fca.org.uk/news"
type = "rss"
jurisdiction = "UK"
category = "Regulator"
tier = 1
cadence = "daily"
notes = "Enforcement, Dear CEO letters, speeches, Market Watch."

[[source]]
name = "FCA - Publications"
url = "https://www.fca.org.uk/publications/rss.xml"
homepage = "https://www.fca.org.uk/publications"
