# ============================================================ GLOBAL
[[source]]
name = "FATF - Publications"
url = "https://www.fatf-gafi.org/en/publications.html"
homepage = "https://www.fatf-gafi.org/en/publications.html"
type = "links"
jurisdiction = "Global"
category = "Standards"
tier = 1
cadence = "weekly"
link_pattern = "fatf-gafi\\.org/en/publications/"
notes = """FLAKY BY DESIGN: sits behind Cloudflare, which intermittently returns 403 \
regardless of headers (it fingerprints the TLS stack, not the request). The fetcher \
retries via curl, which often succeeds. Expect this source to fail on some runs - \
that is not a bug in the tool. The 'News - FATF and standards' feed below is the \
reliable complement."""

[[source]]
name = "OFAC - Recent actions (US)"
url = "https://ofac.treasury.gov/rss.xml"
homepage = "https://ofac.treasury.gov/recent-actions"
type = "rss"
jurisdiction = "Global"
category = "Sanctions"
tier = 1
cadence = "daily"
notes = "US designations. Matters for UK/EU KYC via correspondent banking and secondary sanctions risk."

[[source]]
name = "OpenSanctions - Changelog"
url = "https://www.opensanctions.org/changelog/"
homepage = "https://www.opensanctions.org/"
type = "links"
jurisdiction = "Global"
category = "Sanctions"
tier = 2
cadence = "weekly"
link_pattern = "opensanctions\\.org/(datasets|changelog|articles)/"
notes = "Consolidated OFSI+OFAC+EU+UN sanctions/PEP data. Free bulk data; paid API only for scale."

[[source]]
name = "Wolfsberg Group"
url = "https://wolfsberg-group.org/news"
homepage = "https://wolfsberg-group.org/"
type = "links"
jurisdiction = "Global"
category = "Guidance"
tier = 2
cadence = "weekly"
enabled = false
link_pattern = "wolfsberg-group\\.org/(news|resources)/"
notes = """DISABLED: the site is a Nuxt single-page app - the served HTML contains only \
JavaScript bundles, no content links, so scraping returns nothing. Wolfsberg publishes \
only a handful of papers a year, so a quarterly manual check of \
https://wolfsberg-group.org/resources is the honest substitute."""

